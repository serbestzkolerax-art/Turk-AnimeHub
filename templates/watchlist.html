{% extends "base.html" %}

{% block content %}
<div class="mb-12">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-gray-100 flex items-center gap-2">
            <span class="text-indigo-500 text-3xl leading-none">&bull;</span> İzleme Listem
        </h2>
        {% if watchlist %}
        <button onclick="clearWatchlist()" class="text-sm text-gray-400 hover:text-red-400 transition-colors">Listeyi Temizle</button>
        {% endif %}
    </div>

    {% if watchlist %}
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-6">
        {% for item in watchlist %}
        <div class="group relative flex flex-col bg-cardbg rounded-xl overflow-hidden shadow-lg hover:shadow-indigo-500/20 transition-all duration-300 hover:-translate-y-1">
            <a href="/?slug={{ item.slug }}" class="block aspect-[3/4] overflow-hidden relative">
                <img src="/api/cover?title={{ item.title|urlencode }}" alt="{{ item.title }}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                <div class="absolute inset-0 bg-gradient-to-t from-darker via-darker/20 to-transparent opacity-60 group-hover:opacity-80 transition-opacity"></div>
                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    <div class="bg-indigo-600/90 rounded-full p-3 transform scale-75 group-hover:scale-100 transition-transform duration-300">
                        <svg class="w-8 h-8 text-white ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"/></svg>
                    </div>
                </div>
            </a>
            <div class="absolute top-2 right-2 z-10">
                <button onclick="removeFromWatchlist('{{ item.slug }}', event)" class="p-1.5 bg-red-500/80 hover:bg-red-500 text-white rounded-full backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity duration-300 shadow-lg">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <a href="/?slug={{ item.slug }}" class="p-3 block">
                <h3 class="font-semibold text-sm text-gray-200 group-hover:text-indigo-400 transition-colors line-clamp-2" title="{{ item.title }}">{{ item.title }}</h3>
            </a>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="w-full flex items-center justify-center p-8 text-gray-400 bg-cardbg rounded-xl">Listeniz şu an boş. Anime izleme sayfasından listenize anime ekleyebilirsiniz.</div>
    {% endif %}
</div>

<script>
    async function removeFromWatchlist(slug, event) {
        if (event) event.preventDefault();
        try {
            await fetch('/api/watchlist', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slug })
            });
            window.location.reload();
        } catch(e) {
            console.error("Remove failed", e);
        }
    }

    async function clearWatchlist() {
        if (confirm("İzleme listenizi tamamen temizlemek istediğinize emin misiniz?")) {
            try {
                await fetch('/api/watchlist/clear', { method: 'POST' });
                window.location.reload();
            } catch(e) {
                console.error("Clear failed", e);
            }
        }
    }
</script>
{% endblock %}
